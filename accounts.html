<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RIFT — Accounts</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

<div class="dashboard-page">


  <!-- HEADER -->

  <header class="dashboard-header">

    <div class="brand">

      <div class="rift-logo">
        ⚡
      </div>

      <div>

        <h1>RIFT</h1>

        <p>
          ALLIANCE ACCOUNT DIRECTORY
        </p>

      </div>

    </div>


    <div class="header-right">

      <span class="online">
        🟢 ONLINE
      </span>

      <button
        class="logout-button"
        onclick="logout()"
      >
        LOG OUT
      </button>

    </div>

  </header>



  <!-- NAVIGATION -->

  <nav class="dashboard-nav">

    <button onclick="openPage('dashboard.html')">
      🏠 Dashboard
    </button>

    <button onclick="openPage('accounts.html')">
      👥 Accounts
    </button>

    <button onclick="openPage('finance.html')">
      🏦 Finance
    </button>

    <button onclick="openPage('profile.html')">
      🌎 Profile
    </button>

  </nav>



  <!-- TITLE -->

  <section class="welcome-card">

    <div>

      <span class="status">
        👥 ACCOUNT DIRECTORY
      </span>

      <h2>
        Alliance Accounts
      </h2>

      <p>
        Search and access registered RIFT nations.
      </p>

    </div>

    <div class="command-icon">
      👥
    </div>

  </section>



  <!-- SEARCH -->

  <section class="activity-card">

    <h3>
      🔎 SEARCH ACCOUNTS
    </h3>

    <input
      type="text"
      id="searchBox"
      placeholder="Search leader or nation..."
      oninput="searchAccounts()"
      style="
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        border: 1px solid #d7deeb;
        font-size: 16px;
      "
    >

  </section>



  <!-- ACCOUNT COUNT -->

  <section class="money-card">

    <div class="money-header">

      <div>

        <small>
          REGISTERED ACCOUNTS
        </small>

        <div
          id="accountCount"
          class="big-balance"
        >
          0
        </div>

      </div>

      <div class="money-icon">
        🌎
      </div>

    </div>

  </section>



  <!-- ACCOUNT LIST -->

  <section>

    <h3>
      🌐 ALLIANCE NATIONS
    </h3>


    <div
      id="accountList"
      class="dashboard-grid"
    >

      <!-- ACCOUNTS GENERATED BY accounts.js -->

    </div>

  </section>



  <!-- FOOTER -->

  <footer>

    <span>
      ⚡ RIFT Alliance Network
    </span>

    <span>
      👥 Accounts
    </span>

    <span>
      RIFT v2.0
    </span>

  </footer>


</div>



<!-- JAVASCRIPT -->

<script src="accounts.js"></script>

</body>

</html>
