<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rift 💸</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #312e81, #0f172a);
      color: white;
      padding: 25px;
    }

    .app {
      max-width: 900px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
    }

    .badge {
      background: #22c55e;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
    }

    .balance {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 25px;
      padding: 30px;
      margin-bottom: 20px;
    }

    .balance p {
      opacity: 0.7;
      margin-bottom: 5px;
    }

    #money {
      font-size: 48px;
      margin: 0;
    }

    .xp {
      margin-top: 20px;
    }

    .xp-bar {
      height: 10px;
      background: #374151;
      border-radius: 20px;
      overflow: hidden;
    }

    #xpFill {
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: 0.5s;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    button {
      border: none;
      padding: 18px;
      border-radius: 18px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-3px) scale(1.02);
    }

    .deposit {
      background: #22c55e;
      color: white;
    }

    .withdraw {
      background: #ef4444;
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 22px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .goal {
      margin-top: 15px;
    }

    .goal-bar {
      height: 9px;
      background: #374151;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 8px;
    }

    #goalFill {
      width: 45%;
      height: 100%;
      background: #facc15;
    }

    #transactions {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #transactions li {
      padding: 12px;
      margin: 8px 0;
      background: rgba(255,255,255,0.07);
      border-radius: 12px;
    }

    .egg {
      margin-top: 20px;
      text-align: center;
      opacity: 0.6;
      cursor: pointer;
    }

    @media (max-width: 650px) {
      .grid,
      .buttons {
        grid-template-columns: 1fr;
      }

      #money {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">⚡ RIFT</div>
    <div class="badge">🧪 DEMO MODE</div>
  </header>

  <section class="balance">
    <p>Your Rift Balance</p>
    <h1 id="money">₹274.00</h1>

    <div class="xp">
      <small>⚡ Rift XP: <span id="xp">35</span>/100</small>
      <div class="xp-bar">
        <div id="xpFill"></div>
      </div>
    </div>
  </section>

  <div class="buttons">
    <button class="deposit" onclick="deposit()">➕ Deposit ₹50</button>
    <button class="withdraw" onclick="withdraw()">➖ Withdraw ₹50</button>
  </div>

  <div class="grid">

    <div class="card">
      <h2>🎯 Savings Goal</h2>
      <p>🚀 Xbox Fund</p>

      <div class="goal">
        <strong>₹4,500 / ₹10,000</strong>

        <div class="goal-bar">
          <div id="goalFill"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>🏆 Rift Level</h2>
      <h1 id="level">Level 4</h1>
      <p>Keep using Rift to gain XP!</p>
    </div>

    <div class="card" style="grid-column: 1 / -1;">
      <h2>🧾 Recent Activity</h2>

      <ul id="transactions">
        <li>🟢 Demo deposit — ₹100</li>
        <li>🔴 Demo withdrawal — ₹25</li>
        <li>🛒 Pizza — ₹80</li>
      </ul>
    </div>

  </div>

  <div class="egg" onclick="easterEgg()">
    ⚡ Rift v1.0 • click me 👀
  </div>

</div>

<script>

  let balance = 274;
  let xp = 35;
  let level = 4;

  function update() {
    document.getElementById("money").textContent =
      "₹" + balance.toFixed(2);

    document.getElementById("xp").textContent = xp;
    document.getElementById("xpFill").style.width = xp + "%";
    document.getElementById("level").textContent =
      "Level " + level;
  }

  function addXP(amount) {
    xp += amount;

    if (xp >= 100) {
      xp = 0;
      level++;
      alert("🔥 LEVEL UP! Rift Level " + level);
    }

    update();
  }

  function deposit() {
    balance += 50;

    addTransaction("🟢 Demo deposit", 50);
    addXP(10);

    update();
  }

  function withdraw() {
    if (balance < 50) {
      alert("💀 Bro is broke.");
      return;
    }

    balance -= 50;

    addTransaction("🔴 Demo withdrawal", 50);
    addXP(7);

    update();
  }

  function addTransaction(type, amount) {

    const list = document.getElementById("transactions");

    const item = document.createElement("li");

    item.textContent =
      type + " — ₹" + amount;

    list.prepend(item);
  }

  let clicks = 0;

  function easterEgg() {

    clicks++;

    if (clicks === 7) {
      alert("🕵️ YOU FOUND THE RIFT SECRET 💀⚡");
      clicks = 0;
    }
  }

  update();

</script>

</body>
</html>
